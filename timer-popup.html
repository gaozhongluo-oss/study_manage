<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>番茄计时 · 浮窗</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f7cff'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='3'/%3E%3Cpath d='M16 11v5l3 2' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/popup.css">
</head>
<body>
<div class="pp" id="pp">
  <div class="pp-head">
    <i class="pp-dot" id="ppDot"></i>
    <span class="pp-proj" id="ppProj">番茄计时</span>
    <span class="pp-round" id="ppRound">第 1 轮</span>
    <button class="pp-x" id="ppClose" type="button" title="关掉这个小窗（不影响计时）">✕</button>
  </div>

  <div class="pp-clock" id="ppClock">05:00</div>
  <div class="pp-bar"><span id="ppBar"></span></div>

  <div class="pp-ask" id="ppAsk" hidden>是否还在学习？</div>
  <p class="pp-status" id="ppStatus">等待开始…</p>

  <div class="pp-actions">
    <button class="pp-btn primary" id="ppContinue" type="button" hidden>继续</button>
    <button class="pp-btn" id="ppStop" type="button" hidden>停止</button>
    <button class="pp-btn ghost" id="ppEnd" type="button" hidden>结束</button>
  </div>
</div>

<p class="pp-tip" id="ppTip">主页面点「开始计时」后，这个浮窗会一直显示进度；到点在这里就能直接点「继续」。</p>

<script src="js/util.js"></script>
<script src="js/stats.js"></script>
<script src="js/store.js"></script>
<script src="js/notify.js"></script>
<script src="js/popup.js"></script>
</body>
</html>
